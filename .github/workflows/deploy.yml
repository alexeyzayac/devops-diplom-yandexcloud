name: 'CI/CD: Build, Push and Deploy'

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Yandex Container Registry
      uses: docker/login-action@v3
      with:
        registry: cr.yandex
        username: oauth
        password: ${{ secrets.YC_SA_KEY_JSON }}

    - name: Determine Image Tag
      id: tag
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        fi

    - name: Build and Push Docker Image
      run: |
        IMAGE_NAME="cr.yandex/${{ secrets.REGISTRY_ID }}/diplom-app:${{ env.TAG }}"
        echo "Building and pushing $IMAGE_NAME"
        docker build --provenance=false --sbom=false -f app/app.Dockerfile -t $IMAGE_NAME .
        docker push $IMAGE_NAME

    - name: Deploy to Minikube using Helm
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
        export KUBECONFIG=$HOME/.kube/config

        echo "image: cr.yandex/${{ secrets.REGISTRY_ID }}/diplom-app:${{ env.TAG }}" > k8s/app-diplom/values-image.yaml

        helm upgrade --install app-diplom ./k8s/app-diplom \
          -f ./k8s/app-diplom/values.yaml \
          -f ./k8s/app-diplom/values-image.yaml \
          --namespace app-diplom --create-namespace

        kubectl rollout status deployment/app-zayac -n app-diplom