name: 'CI/CD: Build, Push and Deploy'

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Yandex Cloud Container Registry
      uses: yc-actions/yc-cr-login@v1
      with:
        yc-sa-json-credentials: ${{ secrets.YC_SA_KEY_JSON }}

    - name: Determine Image Tag
      id: tag
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        fi

    - name: Build and Push Docker Image
      run: |
        IMAGE_NAME="cr.yandex/${{ secrets.REGISTRY_ID }}/diplom-app:${{ env.TAG }}"
        echo "Building and pushing $IMAGE_NAME"
        docker build --provenance=false --sbom=false \
          -f app/app.Dockerfile \
          -t $IMAGE_NAME \
          ./app
        docker push $IMAGE_NAME

    - name: Deploy to Minikube using Helm
      run: |
        # Используем уже существующий kubeconfig на машине раннера
        export KUBECONFIG=$HOME/.kube/config
    
        export PATH=$PATH:/usr/local/bin:/usr/bin:/home/main/.local/bin
    
        kubectl cluster-info
    
        echo "image: cr.yandex/${{ secrets.REGISTRY_ID }}/diplom-app:${{ env.TAG }}" \
          > k8s/app-diplom/values-image.yaml
    
        helm upgrade --install app-diplom ./k8s/app-diplom \
          -f ./k8s/app-diplom/values.yaml \
          -f ./k8s/app-diplom/values-image.yaml \
          --namespace app-diplom --create-namespace \
          --wait --timeout 5m
    
        kubectl rollout status deployment/app-zayac -n app-diplom
